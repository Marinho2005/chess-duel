name: chess_duel

services:
  postgres:
    image: postgres:18
    container_name: chess_duel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chess_duel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_duel_password}
      POSTGRES_DB: ${POSTGRES_DB:-chess_duel_dev}
    ports:
      - "5432:5432"
    # postgres:18+ movimentou o PGDATA para um layout versionado sob
    # /var/lib/postgresql (a imagem cria o subdiretorio major/minor).
    # Montar em .../data, como nas versoes anteriores, faz o container
    # rejeitar e reiniciar em loop. Montamos no pai e deixamos a imagem
    # cuidar da estrutura interna.
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chess_duel} -d ${POSTGRES_DB:-chess_duel_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: chess_duel_valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: chess_duel_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MIX_ENV: dev
      DATABASE_URL: ""
      DB_HOST: postgres
      DB_PORT: 5432
      VALKEY_URL: redis://valkey:6379
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/deps
      - /app/_build
      - /app/priv/chess_validator/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: chess_duel_frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend

volumes:
  postgres_data:
  valkey_data:
